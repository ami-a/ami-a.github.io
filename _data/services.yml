services:
  - title: Medical Imaging / Computer Vision R&D
    slug: medical-imaging-cv
    featured: true
    audience: Biotech and medical-AI teams
    summary: Senior technical support for imaging-heavy products involving segmentation, registration, calibration, spatial alignment, microscopy, pathology, or precision image-processing workflows.
    typical_start: After scope review
    typical_duration: 1–3 week sprint or monthly retained R&D
    engagement_type: Sprint, advisory, or retained R&D
    problems:
      - Medical image segmentation or post-processing is unreliable
      - Scans, microscopy images, or spatial data need alignment or calibration
      - Research code needs to become a working technical pipeline
      - AI outputs must connect to physical or lab workflows
    outcomes:
      - Clear technical risk assessment
      - Prototype or production-oriented imaging pipeline
      - Improved spatial alignment, calibration, or workflow reliability
      - Practical roadmap for implementation or validation
    proof_hint: Medical-imaging AI work involving segmentation, scan interpretation, geometric calibration, spatial alignment, precision output generation, lab validation, and patent filings.

  - title: Research Engineering Sprint
    slug: research-engineering-sprint
    audience: AI startups and R&D teams
    summary: Focused research-to-product execution for teams that need a prototype, paper implementation, benchmark, feasibility answer, or architecture path through an ambiguous technical problem.
    typical_start: After problem and data review
    typical_duration: Usually scoped in 1–3 week blocks
    engagement_type: Fixed-scope sprint or senior hourly execution
    problems:
      - A promising AI method needs to be tested quickly
      - A prototype is blocked by research uncertainty
      - A paper or open-source method needs adaptation to real data
      - The team needs senior technical judgment before committing engineering budget
    outcomes:
      - Feasibility assessment
      - Working prototype or benchmark
      - Technical constraints and failure modes
      - Recommended implementation path
    proof_hint: Experience turning ambiguous AI ideas into working prototypes across Meta Reality Labs, QuantumCyte, and AGAT Software.

  - title: AI / CV Technical Due Diligence
    slug: ai-cv-technical-diligence
    audience: Founders, investors, and technical leaders
    summary: Independent assessment of whether an AI, computer-vision, medical-imaging, or spatial-AI claim is technically real, scalable, defensible, and execution-ready.
    typical_start: After brief technical material review
    typical_duration: Lightweight review, diligence memo, or deeper technical assessment
    engagement_type: Advisory, diligence, or technical review
    problems:
      - A vendor, startup, or internal team claims strong AI/CV performance
      - Technical risk is unclear before investment or product commitment
      - Model, data, architecture, or deployment claims need expert review
      - Leadership needs a clear go/no-go technical opinion
    outcomes:
      - Clear technical risk map
      - Feasibility and scalability assessment
      - Architecture and data-quality review
      - Practical recommendations for next steps
    proof_hint: Senior AI R&D background across computer vision, spatial AI, medical imaging, LLM systems, and production-oriented AI workflows.
