<!-- Case study cards: selected work showcase -->
<section class="case-study-cards">
  <h2>Selected Work</h2>
  <div class="cards-container">
    {% assign featured_studies = site.case_studies | sort: "ind" | slice: 0, 4 %}
    {% if featured_studies.size > 0 %}
      {% for study in featured_studies %}
        <div class="case-card">
          <h3>{{ study.title }}</h3>
          <p class="year">{{ study.domain }}</p>
          <p class="description">{{ study.summary }}</p>
          <a href="{{ study.url }}" class="card-link">View →</a>
        </div>
      {% endfor %}
    {% else %}
      <p>Case studies to be displayed.</p>
    {% endif %}
  </div>
</section>
