<!-- SEO, analytics, and meta tags -->
{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

<!-- "Hire Me!" button animation script -->
<script>
const sentence = 'Hire Me!';
setInterval(function () {
  var x = document.getElementsByClassName("btn");
  for (var i = 0; i < x.length; i++) {
     x.item(i).setAttribute('data-value', "#"+(sentence.charCodeAt(Math.floor(Math.random()*sentence.length) >>> 0)*Math.floor(Math.random()*8)).toString(2));
  }
}, 120);
</script>

<meta property='og:image' content="{{ site.url }}/img/site.png"/>
